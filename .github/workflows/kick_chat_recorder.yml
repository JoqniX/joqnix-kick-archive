name: Kick Chat Recorder

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */5 * * *"

jobs:

  record:

    runs-on: ubuntu-latest

    timeout-minutes: 330

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Run chat recorder
        run: python -u scripts/kick_chat_recorder.py

      - name: Commit results
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add .
          git commit -m "Update live chat logs" || echo "No changes"
          git push
