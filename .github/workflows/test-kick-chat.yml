name: Test Kick Chat Downloader

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Clone TwitchDownloader
        run: |
          git clone https://github.com/lay295/TwitchDownloader.git
          cd TwitchDownloader
          git checkout kick-support

      - name: Build CLI
        run: |
          cd TwitchDownloader/TwitchDownloaderCLI
          dotnet build

      - name: Download Kick chat
        run: |
          cd TwitchDownloader/TwitchDownloaderCLI/bin/Debug/net6.0
          dotnet TwitchDownloaderCLI.dll chatdownload \
            --platform Kick \
            --id https://kick.com/joqnix/videos/cdf794d6-cc7f-497d-a30e-5d0fddb2f8e6 \
            --output chat.json

      - name: Upload chat artifact
        uses: actions/upload-artifact@v4
        with:
          name: kick-chat
          path: TwitchDownloader/TwitchDownloaderCLI/bin/Debug/net6.0/chat.json
