name: Normalize Kick Chat

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

jobs:
  normalize:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run chat normalizer
        run: python scripts/normalize_kick_chat.py

      - name: Commit normalized chats
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add data cache

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Normalize kick chats"

          git pull --rebase origin Main-day || true

          git push || echo "Push failed but continuing"
