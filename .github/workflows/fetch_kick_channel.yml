name: Fetch Kick Channel

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

jobs:
  fetch:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "curl_cffi"

      - name: Fetch Kick channel
        run: python scripts/fetch_kick_channel.py

      - name: Fetch Kick data
        run: python scripts/fetch_kick_data.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/kick/ data/kick_channel.json
          git commit -m "Update Kick channel data" || echo "No changes"
          # other workflows push to this branch too; retry if we lose the race
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin Main-dayo && git push origin Main-dayo && exit 0
            sleep $((RANDOM % 8 + 2))
          done
          exit 1

