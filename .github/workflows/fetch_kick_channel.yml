name: Fetch Kick Channel

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

jobs:
  fetch:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Kick channel
        run: python scripts/fetch_kick_channel.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/kick_channel.json
          git commit -m "Update Kick channel data" || echo "No changes"
          git push
