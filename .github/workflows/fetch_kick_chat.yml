name: Fetch Kick Chat

on:
  schedule:
    - cron: "30 */3 * * *"
  workflow_dispatch:

jobs:
  fetch-chat:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Download Kick chat
        run: python scripts/fetch_kick_chat_via_api.py

      - name: Normalize Kick chat
        run: python scripts/normalize_kick_chat.py

      - name: Commit chat updates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Update Kick chat archive" || echo "No changes"
          git push
