name: Fetch Kick Streams VODs v2

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

jobs:
  fetch-streams:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install curl_cffi

      - name: Fetch Kick streams
        run: python scripts/fetch_streams.py

      - name: Commit metadata updates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git commit -m "Update Kick VOD metadata" || echo "No changes"
          # other workflows push to this branch too; retry if we lose the race
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin Main-dayo && git push origin Main-dayo && exit 0
            sleep $((RANDOM % 8 + 2))
          done
          exit 1
